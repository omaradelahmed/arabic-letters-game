<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>حروفي — لعبة الحروف</title>
  <meta name="description" content="لعبة تعليمية للأطفال من 3 إلى 6 سنوات: اختار الباب اللي بيبدأ بنفس صوت الحرف." />
  <meta name="theme-color" content="#3aa0ff" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="حروفي" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">

    <header class="hud">
      <div class="hud-chip" aria-live="polite">
        <span class="hud-label">النقاط</span>
        <b id="score">0</b>
      </div>
      <div class="hud-chip hud-best">
        <span class="hud-label">أفضل نتيجة</span>
        <b id="best">0</b>
      </div>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
    </header>

    <main class="stage" id="stage">
      <div class="sky" aria-hidden="true">
        <div class="sun"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
        <div class="cloud cloud-c"></div>
      </div>

      <p class="prompt" id="prompt">اختار الباب اللي بيبدأ بنفس الصوت</p>

      <div class="doors" id="doors" role="group" aria-label="اختار الباب الصح">
        <button class="door door-a" type="button" data-index="0">
          <span class="door-arch"></span>
          <span class="door-face">
            <span class="door-emoji">🍚</span>
            <span class="door-word">رُز</span>
          </span>
          <span class="door-badge" aria-hidden="true">✓</span>
        </button>
        <button class="door door-b" type="button" data-index="1">
          <span class="door-arch"></span>
          <span class="door-face">
            <span class="door-emoji">📻</span>
            <span class="door-word">رَاديو</span>
          </span>
          <span class="door-badge" aria-hidden="true">✓</span>
        </button>
      </div>

      <div class="ground" aria-hidden="true"></div>

      <div class="player" id="player" aria-live="polite">
        <span class="player-glyph" id="playerGlyph">رُ</span>
        <button class="speak-btn" id="speakBtn" type="button" aria-label="اسمع صوت الحرف">🔈</button>
      </div>
    </main>

    <div class="overlay" id="startOverlay">
      <div class="card">
        <div class="card-emoji" aria-hidden="true">🚪✨</div>
        <h1>حروفي</h1>
        <p class="card-sub">لعبة الحروف والحركات</p>
        <p class="card-text">اسمع صوت الحرف، واختار الباب اللي بيبدأ بنفس الصوت.</p>
        <button class="big-btn" id="playBtn" type="button">ابدأ اللعب</button>
        <p class="card-note">للأعمار 3–6 · يشتغل بدون إنترنت بعد أول فتح</p>
      </div>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <div class="card">
        <div class="card-emoji" id="overEmoji" aria-hidden="true">🙈</div>
        <h2 id="overTitle">خلاص كده!</h2>
        <p class="card-text" id="overText">الإجابة كانت غلط، بس المحاولة الجاية أحسن.</p>
        <div class="score-big">
          <span>نقاطك</span>
          <b id="finalScore">0</b>
        </div>
        <button class="big-btn" id="againBtn" type="button">العب تاني</button>
      </div>
    </div>

    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </div>

  <script src="./game.js"></script>
</body>
</html>
